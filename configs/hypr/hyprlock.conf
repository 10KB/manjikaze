# Lock screen. PAM uses /etc/pam.d/hyprlock, which includes the system login stack, so a
# YubiKey configured under Security > "Configure Yubikey as MFA for system" works here too:
# with the key inserted, pressing Enter on an empty field unlocks.

general {
    hide_cursor = true
    ignore_empty_input = false
}

background {
    monitor =
    path = ~/.local/share/backgrounds/manjikaze-background.jpg
    color = rgb(11151a)
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = rgb(e6edf3)
    font_size = 96
    font_family = CaskaydiaMono Nerd Font
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = rgba(e6edf3cc)
    font_size = 22
    font_family = CaskaydiaMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 64
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = rgb(3ddc97)
    inner_color = rgba(1a2128ee)
    font_color = rgb(e6edf3)
    font_family = CaskaydiaMono Nerd Font
    fade_on_empty = false
    placeholder_text = <span foreground="##8b98a5">Password for $USER (or Enter with YubiKey)</span>
    check_color = rgb(2bb3a3)
    fail_color = rgb(ff6b6b)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgb(f5c451)
    rounding = 12
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(8b98a5ff)
    font_size = 12
    font_family = CaskaydiaMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}
