# Lock after 5 minutes, turn screens off 30 seconds later. No automatic suspend: long-running
# builds and downloads keep going. Fullscreen video and calls inhibit idle (windows.lua).
# Removing the YubiKey (Security > Auto lock) locks via loginctl and reinserting unlocks.

general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = pkill -USR1 hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
